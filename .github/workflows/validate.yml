name: Validate whitepaper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required artifacts
        run: |
          test -f Denali_Architecture_Whitepaper_v1.md
          test -f LICENSE
          test -f README.md
          test -f .zenodo.json
          python3 -c "import json; json.load(open('.zenodo.json'))"
